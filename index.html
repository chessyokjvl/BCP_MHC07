<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCP Dashboard - ศูนย์สุขภาพจิตที่ 7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Sarabun', sans-serif; }
        .status-card { border-left: 5px solid; }
        .status-normal { border-left-color: #198754; }
        .status-crisis { border-left-color: #dc3545; background-color: #fff3f3; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">MHC7 BCP Portal (อุทกภัย)</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card status-card status-normal mb-4" id="statusContainer">
            <div class="card-body">
                <h5 class="card-title">สถานะปัจจุบัน: <span id="currentStatus">กำลังโหลด...</span></h5>
                <p class="card-text text-muted" id="lastUpdated"></p>
            </div>
        </div>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#actionPlan">แผนปฏิบัติการ (Action Plan)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#contacts">เบอร์โทรฉุกเฉิน</button>
            </li>
        </ul>

        <div class="tab-content bg-white p-3 border border-top-0 rounded-bottom">
            <div class="tab-pane fade show active" id="actionPlan">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ระยะ</th>
                            <th>กิจกรรม</th>
                            <th>ผู้รับผิดชอบ</th>
                            <th>สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="actionTableBody">
                        <tr><td colspan="4" class="text-center">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="tab-pane fade" id="contacts">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>หน่วยงาน / บุคคล</th>
                            <th>เบอร์โทรศัพท์</th>
                            <th>ประเภท</th>
                        </tr>
                    </thead>
                    <tbody id="contactTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // แทนที่ด้วย Web App URL ของคุณที่ได้จาก Step 2
        const API_URL = 'https://script.google.com/macros/s/AKfycbwrATvyeeeaF08KG93tRl3nZ0Hr9eDxK2aN_XuqEGaV0StDCfvL829QjtpReS3Gzxo/exec'; 

        async function fetchStatus() {
            const res = await fetch(`${API_URL}?action=getStatus`);
            const data = await res.json();
            document.getElementById('currentStatus').innerText = data.status;
            document.getElementById('lastUpdated').innerText = `อัปเดตล่าสุด: ${new Date(data.updated).toLocaleString('th-TH')}`;
            
            if(data.status.includes('วิกฤต')) {
                document.getElementById('statusContainer').classList.replace('status-normal', 'status-crisis');
                document.getElementById('currentStatus').classList.add('text-danger', 'fw-bold');
            }
        }

        async function fetchActionPlan() {
            const res = await fetch(`${API_URL}?action=getActionPlan`);
            const data = await res.json();
            let html = '';
            data.forEach(row => {
                html += `<tr>
                            <td><span class="badge bg-secondary">${row.Phase}</span></td>
                            <td>${row.Task}</td>
                            <td>${row.Responsible}</td>
                            <td><input class="form-check-input" type="checkbox" ${row.Status === 'Done' ? 'checked' : ''} disabled></td>
                         </tr>`;
            });
            document.getElementById('actionTableBody').innerHTML = html;
        }

        async function fetchContacts() {
            const res = await fetch(`${API_URL}?action=getContacts`);
            const data = await res.json();
            let html = '';
            data.forEach(row => {
                html += `<tr>
                            <td>${row.Name}</td>
                            <td><a href="tel:${row.Phone.replace(/[^0-9]/g, '')}">${row.Phone}</a></td>
                            <td>${row.Role}</td>
                         </tr>`;
            });
            document.getElementById('contactTableBody').innerHTML = html;
        }

        // เริ่มต้นโหลดข้อมูล
        fetchStatus();
        fetchActionPlan();
        fetchContacts();
    </script>
</body>
</html>
